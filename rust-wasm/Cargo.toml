[package]
name = "amm-wasm"
version = "0.1.0"
edition = "2021"
description = "Rust WASM hot-path for Uniswap V2 AMM constant-product math"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
