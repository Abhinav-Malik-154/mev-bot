[package]
name = "amm-math"
version = "0.1.0"
edition = "2021"
description = "Rust/WASM constant-product AMM math for the MEV searcher hot path"
license = "MIT"

# `cdylib` is required by wasm-pack to emit the `.wasm` artifact.
# `rlib` is added so `cargo test` can compile the crate as a normal library
# and run the `#[cfg(test)]` unit tests on the host target. Without `rlib`,
# `cargo test` has no testable target. This does not affect the WASM output.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
