name: Tests

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: TypeScript + Rust + Forge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript strict type check
        run: npx tsc --noEmit

      - name: ESLint
        run: pnpm lint

      # ── Rust / WASM ────────────────────────────────────────────────────────
      # The AMM hot path is Rust compiled to WASM. Its unit tests run on the
      # host target; the artifact the bot actually loads is then rebuilt here
      # so the differential tests below exercise a *freshly compiled* module
      # rather than whatever happens to be committed under pkg/.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/amm-math/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/amm-math/Cargo.lock') }}

      - name: Rust unit tests
        run: pnpm test:rust

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM module
        run: pnpm build:wasm

      # Runs the AMM math tests and, critically, the WASM/TS differential
      # tests — the ones that catch the Rust and TypeScript implementations
      # drifting apart on the money path.
      - name: TypeScript unit tests
        run: pnpm test

      # ── Solidity ───────────────────────────────────────────────────────────
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run Forge unit + fuzz tests
        run: cd contracts && forge test -vvv

      - name: Generate Forge coverage report
        run: cd contracts && forge coverage
