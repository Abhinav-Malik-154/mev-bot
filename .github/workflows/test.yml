name: Tests

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: TypeScript + Rust + Forge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript strict type check
        run: npx tsc --noEmit

      - name: ESLint
        run: pnpm lint

      # ── Rust / WASM ────────────────────────────────────────────────────────
      # The AMM hot path is Rust compiled to WASM. Its unit tests run on the
      # host target; the artifact the bot actually loads is then rebuilt here
      # so the differential tests below exercise a *freshly compiled* module
      # rather than whatever happens to be committed under pkg/.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/amm-math/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/amm-math/Cargo.lock') }}

      - name: Rust unit tests
        run: pnpm test:rust

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM module
        run: pnpm build:wasm

      # Runs the AMM math tests and, critically, the WASM/TS differential
      # tests — the ones that catch the Rust and TypeScript implementations
      # drifting apart on the money path.
      - name: TypeScript unit tests
        # Dummy values only — they exist solely to satisfy config.ts validation
        # at import time (reserveFlip.test.ts imports arbitrage.ts -> config.ts,
        # which requires CHAIN_ID etc.). NOT secrets and NOT used for any real
        # network call: reserveFlip.test.ts drives a stub provider, so no RPC
        # connection is ever opened. The private key is Anvil/Hardhat test
        # account #0 (publicly known, zero funds).
        env:
          ALCHEMY_WS_URL: wss://eth-sepolia.g.alchemy.com/v2/dummy_ci_key
          ALCHEMY_HTTP_URL: https://eth-sepolia.g.alchemy.com/v2/dummy_ci_key
          FLASHBOTS_RELAY_URL: https://relay-sepolia.flashbots.net
          EXECUTOR_PRIVATE_KEY: 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
          EXECUTOR_CONTRACT_ADDRESS: 0x0000000000000000000000000000000000000000
          CHAIN_ID: 11155111
          LOG_LEVEL: error
          DB_PATH: ./data/ci-test.db
          MIN_PROFIT_WEI: 1000000000000000
          MAX_GAS_PRICE_GWEI: 50
        run: pnpm test

      # ── Solidity ───────────────────────────────────────────────────────────
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run Forge unit + fuzz tests
        run: cd contracts && forge test -vvv

      - name: Generate Forge coverage report
        run: cd contracts && forge coverage
